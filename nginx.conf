server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle /webconsole without trailing slash
    location = /webconsole {
        return 301 /webconsole/;
    }

    # Main SPA routing under /webconsole - handles all /webconsole/ requests including assets
    location /webconsole/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /webconsole/index.html;
    }

    # Redirect root to webconsole
    location = / {
        return 301 /webconsole/;
    }
}