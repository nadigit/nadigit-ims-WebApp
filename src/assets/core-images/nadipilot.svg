<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 7.7 61 48.6" width="61" height="48.6" role="img" aria-label="NadiPilot">
  <!--
    NadiPilot mark — SILHOUETTE.
    Single-colour on purpose: styles.scss renders this through a CSS mask with
    background-color: currentColor, so the in-app icon inherits brand blue, dark mode and
    hover states. A gradient here would be discarded by the mask.
    For colour use (splash, marketing, docs) see nadipilot-logo.svg.
    Geometry: 64x64 grid, orbit tilted -28deg, spark centred.
  -->
  <g fill="#000000">
    <g transform="rotate(-28 32 32)">
      <ellipse cx="32" cy="32" rx="27" ry="12" fill="none" stroke="#000000" stroke-width="4.4"/>
      <circle cx="53.3" cy="24.6" r="4.6"/>
    </g>
    <path d="M32 18c1 9 5 13 14 14-9 1-13 5-14 14-1-9-5-13-14-14 9-1 13-5 14-14z"/>
  </g>
</svg>
