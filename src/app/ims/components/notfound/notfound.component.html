<div class="brand-auth-page surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <app-brand-logo variant="auto" imgClass="mb-5 brand-auth-logo flex-shrink-0"></app-brand-logo>
        <div class="brand-auth-card-wrap">
            <div class="w-full surface-card py-8 px-5 sm:px-8 flex flex-column align-items-center brand-auth-card">
                <span class="text-primary font-bold text-3xl">404</span>
                <h1 class="text-900 font-bold text-3xl lg:text-5xl mb-2">{{'not_found_page' | translate}}</h1>
                <div class="text-600 mb-5">{{'not_found_text' | translate }}</div>
                <a (click)="goBack()" class="w-full flex align-items-center py-5 border-300 brand-auth-back-link">
                    <span class="flex justify-content-center align-items-center bg-primary border-round brand-auth-back-icon">
                        <i class="text-white pi pi-fw pi-arrow-left text-2xl"></i>
                    </span>
                    <span class="ml-4 flex flex-column">
                        <span class="text-900 lg:text-xl font-medium mb-0 block" style="cursor: pointer;">{{'back_button' | translate}}</span>
                    </span>
                </a>
            </div>
        </div>
    </div>
</div>
