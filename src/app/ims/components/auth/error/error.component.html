<div class="brand-auth-page surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <app-brand-logo variant="auto" imgClass="mb-5 brand-auth-logo flex-shrink-0"></app-brand-logo>
        <div class="brand-auth-card-wrap">
            <div class="w-full surface-card py-8 px-5 sm:px-8 flex flex-column align-items-center brand-auth-card">
                <div class="grid flex flex-column align-items-center">
                    <div class="flex justify-content-center align-items-center brand-auth-icon bg-red-500 border-circle">
                        <i class="pi pi-fw pi-exclamation-circle text-2xl text-white"></i>
                    </div>
                    <h1 class="text-900 font-bold text-5xl mb-2">{{'error_page' | translate}}</h1>
                    <span class="text-600 mb-5">{{'error_text' | translate}}</span>
                    <img src="assets/ims/images/error/asset-error.svg" alt="Error" class="mb-5" width="80%">
                    <button pButton pRipple icon="pi pi-arrow-left" label="{{'back_button' | translate}}" class="p-button-text" (click)="goBack()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
