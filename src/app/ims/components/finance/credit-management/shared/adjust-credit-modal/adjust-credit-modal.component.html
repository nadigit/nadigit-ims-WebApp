<p-dialog [(visible)]="visible"
          [modal]="true"
          [style]="{width: 'min(92vw, 520px)'}"
          [breakpoints]="{'640px': '95vw'}"
          [header]="'adjust_credit' | translate"
          [draggable]="false" [resizable]="false"
          styleClass="ims-form-dialog-shell"
          class="p-fluid"
          (onHide)="close()"
          [closable]="true">
    <ng-template pTemplate="content">
        <div class="ims-form-layout">
            <div class="ims-form-fields">
                <section class="ims-form-section">
                    <header class="ims-form-section__header">
                        <div class="ims-icon-tile ims-icon-tile--sm ims-icon-tile--amber">
                            <i class="pi pi-pencil"></i>
                        </div>
                        <h3 class="ims-form-section__title">{{ 'credit_account' | translate }}</h3>
                    </header>
                    <div class="grid ims-form-section__body">
                        <div class="field col-12">
                            <label for="amount" class="ims-form-label">
                                {{ 'adjustment_amount' | translate }} <span class="required-asterisk">*</span>
                                <span class="ims-form-hint ims-form-hint--inline">
                                    ({{ 'positive_for_increase' | translate }}, {{ 'negative_for_decrease' | translate }})
                                </span>
                            </label>
                            <p-inputNumber
                                inputId="amount"
                                [(ngModel)]="amount"
                                [step]="0.01"
                                mode="currency"
                                [currency]="currency"
                                [ngClass]="{'ng-invalid ng-dirty': submitted && (!amount || amount === 0)}"
                                styleClass="w-full">
                            </p-inputNumber>
                            <small class="p-error" *ngIf="submitted && (!amount || amount === 0)">
                                {{ 'amount_cannot_be_zero' | translate }}
                            </small>
                            <small class="ims-form-hint"
                                [ngClass]="amount && amount > 0 ? 'text-green-600' : 'text-red-600'"
                                *ngIf="amount && creditAccount">
                                {{ 'new_balance' | translate }}: {{ ((creditAccount.creditBalance || 0) + amount) | currency:currency:'symbol':'1.2-2' }}
                            </small>
                        </div>

                        <div class="field col-12">
                            <label for="reason" class="ims-form-label">
                                {{ 'reason' | translate }} <span class="required-asterisk">*</span>
                            </label>
                            <textarea
                                pInputTextarea
                                id="reason"
                                [(ngModel)]="reason"
                                rows="3"
                                [autoResize]="true"
                                [ngClass]="{'ng-invalid ng-dirty': submitted && (!reason || reason.trim() === '')}"
                                placeholder="{{ 'enter_reason_for_adjustment' | translate }}">
                            </textarea>
                            <small class="p-error" *ngIf="submitted && (!reason || reason.trim() === '')">
                                {{ 'reason_required' | translate }}
                            </small>
                        </div>

                        <div class="field col-12">
                            <label for="notes" class="ims-form-label">
                                {{ 'notes' | translate }}
                                <span class="ims-form-hint ims-form-hint--inline">({{ 'optional' | translate }})</span>
                            </label>
                            <textarea
                                pInputTextarea
                                id="notes"
                                [(ngModel)]="notes"
                                rows="2"
                                [autoResize]="true"
                                placeholder="{{ 'enter_additional_notes' | translate }}">
                            </textarea>
                        </div>
                    </div>
                </section>
            </div>

            <div class="ims-form-required-note">
                <small><span class="required-asterisk">*</span> {{ 'fields_marked_with_asterisk_required' | translate }}</small>
            </div>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton
                type="button"
                label="{{ 'cancel_button' | translate }}"
                icon="pi pi-times"
                class="p-button-text"
                (click)="close()"
                [disabled]="isSaving"></button>
        <button pButton
                type="button"
                label="{{ 'adjust_credit' | translate }}"
                icon="pi pi-check"
                class="p-button-warning"
                (click)="saveAdjustment()"
                [loading]="isSaving"
                [disabled]="isSaving"></button>
    </ng-template>
</p-dialog>
