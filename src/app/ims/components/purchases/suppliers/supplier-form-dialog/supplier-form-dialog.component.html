<p-dialog [(visible)]="config.visible" [style]="{width: '500px'}"
    [breakpoints]="{'960px': '90vw', '640px': '95vw'}" header="{{'supplier_details' | translate}}"
    [modal]="true" [draggable]="false" [resizable]="false" class="p-fluid supplier-dialog">
    <ng-template pTemplate="content">
        <div class="grid p-fluid">
            <!-- Supplier Information Section -->
            <div class="col-12">
                <div class="field">
                    <label for="name" class="block mb-2 font-bold">
                        {{ 'supplier_name' | translate }} <span class="required-asterisk">*</span>
                    </label>
                    <div class="p-inputgroup">
                        <span class="p-inputgroup-addon">
                            <i class="pi pi-building"></i>
                        </span>
                        <input type="text" pInputText name="name" [(ngModel)]="config.supplier.name" required autofocus
                            [ngClass]="{'ng-invalid ng-dirty' : submitted && !config.supplier.name}"
                            placeholder="{{ 'enter_supplier_name' | translate }}" />
                    </div>
                    <small class="p-error" *ngIf="submitted && !config.supplier.name">
                        {{ 'supplier_name' | translate }} {{'is_required_label' | translate}}
                    </small>
                </div>

                <div class="field">
                    <label for="email" class="block mb-2 font-bold">
                        {{ 'supplier_email' | translate }}
                    </label>
                    <div class="p-inputgroup">
                        <span class="p-inputgroup-addon">
                            <i class="pi pi-envelope"></i>
                        </span>
                        <input type="email" pInputText name="email" [(ngModel)]="config.supplier.email"
                            placeholder="{{ 'enter_supplier_email' | translate }}" />
                    </div>
                </div>

                <div class="grid">
                    <!-- Country Field -->
                    <div class="field col-12 md:col-6">
                        <label for="country" class="block mb-2 font-bold">
                            {{ 'supplier_country' | translate }}
                        </label>
                        <p-dropdown [(ngModel)]="config.supplier.country"
                            (onChange)="onSelectedCountry(config.supplier.country)" name="country"
                            [options]="countries" optionValue="name" optionLabel="translatedName"
                            [filter]="true" [filterFields]="['name', 'translatedName']"
                            [filterBy]="filterCountry" [showClear]="true"
                            placeholder="{{ 'select_country_option' | translate }}">

                            <ng-template pTemplate="selectedItem">
                                <span *ngIf="config.supplier && config.supplier.country"
                                    class="flex align-items-center gap-2">
                                    <i class="pi pi-globe"></i>
                                    {{ config.supplier.country | countryTranslate }}
                                </span>
                            </ng-template>

                            <ng-template let-option pTemplate="item">
                                <span class="flex align-items-center gap-2">
                                    <i class="pi pi-globe"></i>
                                    {{ option.translatedName }}
                                </span>
                            </ng-template>
                        </p-dropdown>
                    </div>

                    <!-- City Field (shown when country is selected) -->
                    <div class="field col-12 md:col-6" *ngIf="config.supplier.country">
                        <label for="city" class="block mb-2 font-bold">
                            {{ 'supplier_city' | translate }}
                        </label>
                        <p-dropdown [(ngModel)]="config.supplier.city" name="city" optionValue="name"
                            optionLabel="name" [filter]="true" filterBy="name" [options]="this.states"
                            [showClear]="true" placeholder="{{ 'select_city_option' | translate }}">
                            <ng-template pTemplate="selectedItem">
                                <span *ngIf="config.supplier && config.supplier.city" class="flex align-items-center gap-2">
                                    <i class="pi pi-map-marker"></i>
                                    {{config.supplier.city}}
                                </span>
                            </ng-template>
                            <ng-template let-option pTemplate="item">
                                <span class="flex align-items-center gap-2">
                                    <i class="pi pi-map-marker"></i>
                                    {{option.name}}
                                </span>
                            </ng-template>
                        </p-dropdown>
                    </div>
                </div>

                <div class="field">
                    <label for="address" class="block mb-2 font-bold">
                        {{ 'supplier_address' | translate }}
                    </label>
                    <div class="p-inputgroup">
                        <span class="p-inputgroup-addon">
                            <i class="pi pi-home"></i>
                        </span>
                        <textarea rows="3" [(ngModel)]="config.supplier.address" name="address" [autoResize]="true"
                            pInputTextarea placeholder="{{ 'enter_supplier_address' | translate }}"></textarea>
                    </div>
                </div>

                <div class="field">
                    <label for="phoneNumber" class="block mb-2 font-bold">
                        {{ 'supplier_phone_number' | translate }}
                    </label>
                    <div class="p-inputgroup">
                        <span class="p-inputgroup-addon">
                            <i class="pi pi-phone"></i>
                        </span>
                        <input type="tel" pInputText name="phoneNumber" [(ngModel)]="config.supplier.phoneNumber"
                            placeholder="{{ 'enter_supplier_phone' | translate }}" />
                    </div>
                </div>
            </div>
        </div>

        <div class="required-note mt-3">
            <small><span class="required-asterisk">*</span> {{'fields_marked_with_asterisk_required' |
                translate}}</small>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <div class="flex justify-content-between align-items-center w-full">
            <button pButton pRipple label="{{ 'cancel_button' | translate }}" icon="pi pi-times"
                class="p-button-text p-button-danger" (click)="onCancel()"></button>
            <button pButton pRipple label="{{ 'save_button' | translate }}" icon="pi pi-check"
                class="p-button-raised" (click)="onSave()"></button>
        </div>
    </ng-template>
</p-dialog>
