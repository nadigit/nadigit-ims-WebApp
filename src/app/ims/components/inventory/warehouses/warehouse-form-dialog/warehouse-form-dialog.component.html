<p-dialog [(visible)]="config.visible" [style]="{width: '500px'}"
	[breakpoints]="{'960px': '90vw', '640px': '95vw'}" header="{{ config.mode === 'edit' ? ('warehouse_details' | translate) : ('new_warehouse' | translate) }}"
	[modal]="true" [draggable]="false" [resizable]="false" class="p-fluid warehouse-dialog">
	<ng-template pTemplate="content">
		<div class="grid p-fluid">
			<div class="col-12">
				<!-- Warehouse Name -->
				<div class="field">
					<label for="name" class="block mb-2 font-bold">
						{{ 'warehouse_name' | translate }} <span class="required-asterisk">*</span>
					</label>
					<div class="p-inputgroup">
						<span class="p-inputgroup-addon">
							<i class="pi pi-home"></i>
						</span>
						<input type="text" pInputText name="name" [(ngModel)]="config.warehouse.name" required
							placeholder="{{ 'enter_warehouse_name' | translate }}" autofocus
							[ngClass]="{'ng-invalid ng-dirty': config.submitted && !config.warehouse.name}" />
					</div>
					<small class="p-error" *ngIf="config.submitted && !config.warehouse.name">
						{{ 'warehouse_name' | translate }} {{ 'is_required_label' | translate }}
					</small>
				</div>

				<!-- Warehouse Description -->
				<div class="field">
					<label for="description" class="block mb-2 font-bold">
						{{ 'warehouse_description' | translate }}
					</label>
					<div class="p-inputgroup">
						<span class="p-inputgroup-addon">
							<i class="pi pi-align-left"></i>
						</span>
						<textarea pInputTextarea [(ngModel)]="config.warehouse.description" rows="3"
							[autoResize]="true"
							placeholder="{{ 'enter_warehouse_description' | translate }}"></textarea>
					</div>
				</div>

				<!-- Location Fields -->
				<div class="grid location-fields">
					<!-- Country Field -->
					<div class="field col-12 md:col-6">
						<label for="country" class="block mb-2 font-bold">
							{{ 'warehouse_country' | translate }}
						</label>
					<p-dropdown [(ngModel)]="config.warehouse.country"
						(onChange)="onSelectedCountry(config.warehouse.country)" name="country"
						[options]="countries" optionValue="name" optionLabel="translatedName"
						[filter]="true" [filterFields]="['name', 'translatedName']" [filterBy]="filterCountry"
						[showClear]="true" placeholder="{{ 'select_country_option' | translate }}">
						<ng-template pTemplate="selectedItem">
							<span *ngIf="config.warehouse?.country" class="flex align-items-center gap-2">
								<i class="pi pi-globe"></i>
								{{ getSelectedCountryName() }}
							</span>
						</ng-template>

						<ng-template let-option pTemplate="item">
							<span class="flex align-items-center gap-2">
								<i class="pi pi-globe"></i>
								{{ option.translatedName }}
							</span>
						</ng-template>
					</p-dropdown>
					</div>

					<!-- City Field (shown when country is selected) -->
					<div class="field col-12 md:col-6" *ngIf="config.warehouse.country">
						<label for="city" class="block mb-2 font-bold">
							{{ 'warehouse_city' | translate }}
						</label>
						<p-dropdown [(ngModel)]="config.warehouse.city" name="city" [options]="states"
							optionLabel="name" optionValue="name" [filter]="true" filterBy="name" [showClear]="true"
							placeholder="{{ 'select_city_option' | translate }}">
							<ng-template pTemplate="selectedItem">
								<span *ngIf="config.warehouse && config.warehouse.city" class="flex align-items-center gap-2">
									<i class="pi pi-map-marker"></i>
									{{ config.warehouse.city }}
								</span>
							</ng-template>
							<ng-template let-option pTemplate="item">
								<span class="flex align-items-center gap-2">
									<i class="pi pi-map-marker"></i>
									{{ option.name }}
								</span>
							</ng-template>
						</p-dropdown>
					</div>
				</div>

				<!-- Warehouse Address -->
				<div class="field">
					<label for="address" class="block mb-2 font-bold">
						{{ 'warehouse_address' | translate }}
					</label>
					<div class="p-inputgroup">
						<span class="p-inputgroup-addon">
							<i class="pi pi-map"></i>
						</span>
						<textarea pInputTextarea [(ngModel)]="config.warehouse.address" name="address" rows="3"
							[autoResize]="true"
							placeholder="{{ 'enter_warehouse_address' | translate }}"></textarea>
					</div>
				</div>
			</div>
		</div>

		<div class="required-note mt-3">
			<small><span class="required-asterisk">*</span> {{'fields_marked_with_asterisk_required' |
				translate}}</small>
		</div>
	</ng-template>

	<ng-template pTemplate="footer">
		<div class="flex justify-content-between align-items-center w-full">
			<button pButton pRipple label="{{ 'cancel_button' | translate }}" icon="pi pi-times"
				class="p-button-text p-button-danger" (click)="onCancel()"></button>
			<button pButton pRipple label="{{ 'save_button' | translate }}" icon="pi pi-check"
				class="p-button-raised" (click)="onSave()"></button>
		</div>
	</ng-template>
</p-dialog>
